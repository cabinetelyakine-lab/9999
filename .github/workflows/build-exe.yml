name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build-windows:
    name: Build Windows Portable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Install Electron & Electron-Builder
        run: npm install --save-dev electron electron-builder

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Build Portable EXE
        run: npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === 'Election-Staffing-Portable') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log('Deleted: ' + artifact.id);
              }
            }

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Election-Staffing-Portable
          path: release/*.exe
          retention-days: 1
          if-no-files-found: error
